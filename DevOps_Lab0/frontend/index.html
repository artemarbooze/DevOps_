<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Заметки</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 8px; font-size: 16px; }
    button { padding: 8px 16px; font-size: 16px; cursor: pointer; }
    ul { padding: 0; list-style: none; }
    li { padding: 10px 0; border-bottom: 1px solid #ddd; }
    small { color: #888; }
  </style>
</head>
<body>
  <h1>Заметки</h1>

  <form id="form">
    <input id="text" placeholder="Новая заметка" required autofocus>
    <button>Добавить</button>
  </form>

  <ul id="list"></ul>
  <small id="instance"></small>

  <script>
    const list = document.getElementById("list");
    const input = document.getElementById("text");

    async function load() {
      const res = await fetch("/api/notes");
      const data = await res.json();
      list.innerHTML = "";
      for (const note of data.notes) {
        const li = document.createElement("li");
        li.textContent = note.text + " ";
        const time = document.createElement("small");
        time.textContent = new Date(note.created_at + "Z").toLocaleString();
        li.append(time);
        list.append(li);
      }
      document.getElementById("instance").textContent = "Ответил: " + data.instance;
    }

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      await fetch("/api/notes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: input.value }),
      });
      input.value = "";
      load();
    });

    load();
  </script>
</body>
</html>
